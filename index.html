<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burdy Goureige — VELF</title>
  <style>
    :root {
      --bg: #0B0B0F;
      --card: #14141B;
      --white: #FFFFFF;
      --muted: #9A9AB0;
      --violet: #A78BFA;
      --violet-deep: #8B5CF6;
      --line: #26263240;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(139, 92, 246, 0.18);
      border: 1px solid #20202C;
    }
    .header {
      background: #000;
      padding: 40px 24px 32px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background-image: radial-gradient(circle at 50% 0%, rgba(167,139,250,0.18), transparent 60%);
    }
    .header img {
      max-width: 220px;
      width: 70%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .header .logo-fallback {
      font-size: 56px;
      letter-spacing: 14px;
      font-weight: 300;
      padding-left: 14px;
    }
    .header .logo-fallback b { color: var(--violet); font-weight: 300; }
    .header .tagline {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 5px;
      margin-top: 8px;
      text-transform: uppercase;
    }
    .body { padding: 28px 24px 32px; }
    .name {
      font-size: 26px;
      font-weight: 600;
      text-align: center;
    }
    .role {
      text-align: center;
      color: var(--violet);
      font-size: 15px;
      margin-top: 4px;
      margin-bottom: 24px;
    }
    .rows { display: flex; flex-direction: column; gap: 4px; margin-bottom: 28px; }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--white);
      transition: background 0.2s;
    }
    .row:hover { background: #1E1E29; }
    .row .icon {
      width: 42px; height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      background: rgba(167,139,250,0.12);
      display: flex; align-items: center; justify-content: center;
      color: var(--violet);
    }
    .row .icon svg { width: 20px; height: 20px; }
    .row .text small { display: block; color: var(--muted); font-size: 12px; }
    .row .text span { font-size: 15px; }
    .btn-add {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--violet), var(--violet-deep));
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-add:hover { opacity: 0.92; }
    .btn-add svg { width: 20px; height: 20px; }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 18px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="velf-logo.png" alt="VELF" onerror="this.style.display='none';document.getElementById('lf').style.display='block'">
      <div id="lf" class="logo-fallback" style="display:none">VEL<b>F</b><div class="tagline">Digital Agency</div></div>
    </div>

    <div class="body">
      <div class="name">Burdy Goureige</div>
      <div class="role">Fondateur — VELF</div>

      <div class="rows">
        <a class="row" href="tel:+33663063930">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
          <span class="text"><small>Téléphone</small><span>06 63 06 39 30</span></span>
        </a>
        <a class="row" href="mailto:burdy.gou@gmail.com">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg></span>
          <span class="text"><small>Email</small><span>burdy.gou@gmail.com</span></span>
        </a>
        <a class="row" href="https://nettoyagemontreuil.fr" target="_blank">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
          <span class="text"><small>Site web</small><span>nettoyagemontreuil.fr</span></span>
        </a>
        <a class="row" href="https://maps.google.com/?q=6+rue+porte+au+pain+Dammartin-en-Goele" target="_blank">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
          <span class="text"><small>Adresse</small><span>6 rue porte au pain, Dammartin-en-Goële</span></span>
        </a>
      </div>

      <a class="btn-add" id="addBtn" href="#" download="Burdy_Goureige.vcf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Ajouter à mes contacts
      </a>
    </div>

    <div class="footer">VELF — Digital Agency</div>
  </div>

  <script>
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:Goureige;Burdy;;;",
      "FN:Burdy Goureige",
      "ORG:VELF",
      "TITLE:Fondateur",
      "TEL;TYPE=CELL:+33663063930",
      "EMAIL:burdy.gou@gmail.com",
      "URL:https://nettoyagemontreuil.fr",
      "ADR;TYPE=WORK:;;6 rue porte au pain;Dammartin-en-Goele;;77230;France",
      "END:VCARD"
    ].join("\r\n");
    const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    document.getElementById("addBtn").href = URL.createObjectURL(blob);
  </script>
</body>
</html>
